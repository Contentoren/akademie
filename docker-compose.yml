services:
  akademie:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3120:3120"
    environment:
      APP_URL: "http://localhost:3120"
      VITE_CONVEX_URL: "${VITE_CONVEX_URL:-}"
    volumes:
      - .:/app
      - akademie_node_modules:/app/node_modules

volumes:
  akademie_node_modules:
